<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q8 - Photo Gallery (Grid)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="gallery">
    <figure>
      <img src="https://placehold.co/400x300?text=Mountains" alt="Mountains">
      <figcaption>Mountains at dawn</figcaption>
    </figure>
    <figure>
      <img src="https://placehold.co/400x300?text=Coast" alt="Coastline">
      <figcaption>Coastline in autumn</figcaption>
    </figure>
    <figure>
      <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
      <figcaption>Forest trail</figcaption>
    </figure>
    <figure>
      <img src="https://placehold.co/400x300?text=Desert" alt="Desert">
      <figcaption>Desert dunes</figcaption>
    </figure>
    <figure>
      <img src="https://placehold.co/400x300?text=City" alt="City skyline">
      <figcaption>City at night</figcaption>
    </figure>
    <figure>
      <img src="https://placehold.co/400x300?text=Lake" alt="Lake">
      <figcaption>Still lake</figcaption>
    </figure>
  </main>
</body>
</html>
