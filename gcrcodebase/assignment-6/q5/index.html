<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q5 - Pricing (Flexbox)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="pricing">
    <div class="plan">
      <h2>Basic</h2>
      <p class="price">$9<span>/mo</span></p>
      <ul>
        <li>1 project</li>
        <li>Email support</li>
        <li>5GB storage</li>
      </ul>
    </div>

    <div class="plan featured">
      <h2>Pro</h2>
      <p class="price">$29<span>/mo</span></p>
      <ul>
        <li>Unlimited projects</li>
        <li>Priority support</li>
        <li>50GB storage</li>
      </ul>
    </div>

    <div class="plan">
      <h2>Team</h2>
      <p class="price">$49<span>/mo</span></p>
      <ul>
        <li>Unlimited projects</li>
        <li>Dedicated support</li>
        <li>200GB storage</li>
      </ul>
    </div>
  </section>
</body>
</html>
