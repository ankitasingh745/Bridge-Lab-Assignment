<!DOCTYPE html>
<!-- Question 2: Hyperlink to Google that opens in a new tab -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink Example</title>
</head>
<body>

    <!-- target="_blank" opens the link in a new tab -->
    <p>
        Click here to search anything on
        <a href="https://www.google.com" target="_blank">Google</a>.
    </p>

</body>
</html>
