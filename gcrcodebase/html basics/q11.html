<!DOCTYPE html>
<!-- Question 11: Paragraph containing three <span> elements to label parts of text -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Example</title>
</head>
<body>

    <!-- Each span could be imagined as styled differently, e.g. with a color -->
    <p>
        My favorite subjects are
        <span>Mathematics</span> (logical),
        <span>Art</span> (creative), and
        <span>Computer Science</span> (technical).
    </p>

</body>
</html>
