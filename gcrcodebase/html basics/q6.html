<!DOCTYPE html>
<!-- Question 6: A meaningful quote using <blockquote> and the author using <cite> -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Favorite Quote</title>
</head>
<body>

    <blockquote>
        The only way to do great work is to love what you do.
    </blockquote>
    <p>— <cite>Steve Jobs</cite></p>

</body>
</html>
