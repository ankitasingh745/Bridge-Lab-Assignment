<!DOCTYPE html>
<!-- Question 7: Demonstrating different heading levels -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Heading Levels</title>
</head>
<body>

    <!-- h1 for name -->
    <h1>Alex Morgan</h1>

    <!-- h2 for role -->
    <h2>Student</h2>

    <!-- h3 for hobbies/interests -->

</body>
</html>
